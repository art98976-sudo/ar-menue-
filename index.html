<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MenuVision</title>

<!-- model-viewer: this is what talks to the phone's AR and finds the table -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#131110;
    --surface:#1D1917;
    --surface-2:#272220;
    --line:#3A3330;
    --text:#EFE9E1;
    --muted:#9B918A;
    --accent:#D6B25E;
    --accent-ink:#1A1512;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }

  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 40px}

  /* ---------- header ---------- */
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
  .brand{font-family:'Instrument Serif',serif;font-size:26px;letter-spacing:.3px}
  .brand em{font-style:italic;color:var(--accent)}
  .venue{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* ---------- dish tabs ---------- */
  .tabs{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:16px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;padding:9px 16px;border-radius:100px;border:1px solid var(--line);
    background:transparent;color:var(--muted);font-size:13.5px;font-weight:500;
    cursor:pointer;white-space:nowrap;transition:.18s ease;font-family:inherit;
  }
  .tab:hover{border-color:var(--muted)}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- viewer ---------- */
  .stage{
    position:relative;background:var(--surface);border:1px solid var(--line);
    border-radius:18px;overflow:hidden;margin-bottom:14px;
  }
  model-viewer{
    width:100%;height:340px;display:block;background:transparent;
    --poster-color:transparent;
  }
  .hint{
    position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--muted);
    background:rgba(19,17,16,.75);padding:5px 10px;border-radius:100px;
    backdrop-filter:blur(6px);pointer-events:none;
  }

  /* ---------- AR button ---------- */
  .ar-btn{
    width:100%;padding:15px;border:none;border-radius:14px;
    background:var(--accent);color:var(--accent-ink);
    font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:.18s ease;margin-bottom:8px;
  }
  .ar-btn:active{transform:scale(.985)}
  .ar-btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
  .ar-btn svg{width:17px;height:17px;flex:0 0 auto}

  .ar-note{font-size:12px;color:var(--muted);text-align:center;margin-bottom:22px;line-height:1.5}
  .ar-note.warn{color:#E0A0A0}

  /* ---------- dish info ---------- */
  .dish-name{font-family:'Instrument Serif',serif;font-size:32px;line-height:1.1;margin-bottom:6px}
  .dish-desc{font-size:14px;color:var(--muted);line-height:1.55;margin-bottom:18px}

  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
  .fact{background:var(--surface);padding:14px 12px;text-align:center}
  .fact dt{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .fact dd{font-size:17px;font-weight:600}

  .section-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
  .chip{padding:6px 12px;border-radius:100px;background:var(--surface-2);font-size:12.5px;color:var(--text)}
  .chip.allergen{background:transparent;border:1px solid #6B4A2A;color:#D9A66C}

  footer{border-top:1px solid var(--line);padding-top:16px;font-size:11px;color:var(--muted);text-align:center;line-height:1.6}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="brand">Menu<em>Vision</em></div>
    <div class="venue">Table 12</div>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="stage">
    <model-viewer
      id="viewer"
      ar
      ar-modes="scene-viewer quick-look webxr"
      ar-placement="floor"
      ar-scale="fixed"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1.1"
      shadow-softness="0.9"
      exposure="0.95"
      environment-image="neutral"
      camera-orbit="0deg 72deg 105%"
      alt="3D preview of the selected dish">
      <button slot="ar-button" style="display:none"></button>
    </model-viewer>
    <div class="hint">Drag to rotate</div>
  </div>

  <button class="ar-btn" id="arBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
      <path d="M12 8.5 8 10.7v4.6l4 2.2 4-2.2v-4.6z"/>
    </svg>
    See it on your table
  </button>
  <p class="ar-note" id="arNote">Point your camera at the table — the dish lands at its real size.</p>

  <h1 class="dish-name" id="dishName"></h1>
  <p class="dish-desc" id="dishDesc"></p>

  <dl class="facts">
    <div class="fact"><dt>Price</dt><dd id="fPrice"></dd></div>
    <div class="fact"><dt>Calories</dt><dd id="fCal"></dd></div>
    <div class="fact"><dt>Size</dt><dd id="fSize"></dd></div>
  </dl>

  <div class="section-label">Ingredients</div>
  <div class="chips" id="ingredients"></div>

  <div class="section-label">Contains</div>
  <div class="chips" id="allergens"></div>

  <footer>Shown at true portion size. Ask your server about allergies.</footer>

</div>

<script>
/* ══════════════════════════════════════════════════════════════
   DISH DATA — edit this block only. Everything else is plumbing.

   glb  : Android + in-page 3D preview
   usdz : iPhone AR. Without it, iPhone users get no AR button.
   ══════════════════════════════════════════════════════════════ */
const DISHES = {
  pizza: {
    name: "Margherita Pizza",
    desc: "Slow-proved 48-hour dough, San Marzano tomato, fior di latte, basil picked to order.",
    glb: "models/pizza.glb",
    usdz: "models/pizza.usdz",
    price: "£11.50",
    calories: "820 kcal",
    size: "12 inch",
    ingredients: ["Sourdough base", "San Marzano tomato", "Fior di latte", "Fresh basil", "Olive oil"],
    allergens: ["Gluten", "Milk"]
  },
  burger: {
    name: "Smash Burger",
    desc: "Two 90g dry-aged patties, smashed on the plancha, aged cheddar, house pickles.",
    glb: "models/burger.glb",
    usdz: "models/burger.usdz",
    price: "£13.00",
    calories: "940 kcal",
    size: "5 inch",
    ingredients: ["Dry-aged beef", "Aged cheddar", "Brioche bun", "House pickles", "Burger sauce"],
    allergens: ["Gluten", "Milk", "Egg", "Mustard"]
  },
  pasta: {
    name: "Cacio e Pepe",
    desc: "Bronze-cut tonnarelli, Pecorino Romano, cracked Tellicherry pepper. Nothing else.",
    glb: "models/pasta.glb",
    usdz: "models/pasta.usdz",
    price: "£12.00",
    calories: "710 kcal",
    size: "20 cm bowl",
    ingredients: ["Tonnarelli", "Pecorino Romano", "Black pepper"],
    allergens: ["Gluten", "Milk"]
  },
  sushi: {
    name: "Sashimi Platter",
    desc: "Twelve pieces cut to order — salmon, tuna, yellowtail. Served with wasabi and pickled ginger.",
    glb: "models/sushi.glb",
    usdz: "models/sushi.usdz",
    price: "£24.00",
    calories: "480 kcal",
    size: "20 cm platter",
    ingredients: ["Salmon", "Tuna", "Yellowtail", "Wasabi", "Pickled ginger"],
    allergens: ["Fish", "Soya"]
  },
  drink: {
    name: "Blood Orange Spritz",
    desc: "Sicilian blood orange, prosecco, soda, over a single block of clear ice.",
    glb: "models/drink.glb",
    usdz: "models/drink.usdz",
    price: "£8.50",
    calories: "180 kcal",
    size: "250 ml",
    ingredients: ["Blood orange", "Prosecco", "Soda water", "Orange bitters"],
    allergens: ["Sulphites"]
  }
};

/* ────────── element refs ────────── */
const viewer = document.getElementById('viewer');
const arBtn  = document.getElementById('arBtn');
const arNote = document.getElementById('arNote');
const tabsEl = document.getElementById('tabs');

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
           || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ────────── build the dish tabs ────────── */
Object.keys(DISHES).forEach((id, i) => {
  const b = document.createElement('button');
  b.className = 'tab';
  b.type = 'button';
  b.role = 'tab';
  b.textContent = DISHES[id].name;
  b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
  b.addEventListener('click', () => selectDish(id));
  tabsEl.appendChild(b);
});

/* ────────── swap the dish ────────── */
function selectDish(id) {
  const d = DISHES[id];
  if (!d) return;

  // Point the viewer at the new model. Both files must be set —
  // Android reads src, iPhone reads ios-src.
  viewer.src = d.glb;
  if (d.usdz) viewer.setAttribute('ios-src', d.usdz);
  else viewer.removeAttribute('ios-src');
  viewer.alt = `3D preview of ${d.name}`;

  document.getElementById('dishName').textContent = d.name;
  document.getElementById('dishDesc').textContent = d.desc;
  document.getElementById('fPrice').textContent = d.price;
  document.getElementById('fCal').textContent = d.calories;
  document.getElementById('fSize').textContent = d.size;

  fillChips('ingredients', d.ingredients, '');
  fillChips('allergens', d.allergens, ' allergen');

  [...tabsEl.children].forEach(t =>
    t.setAttribute('aria-selected', String(t.textContent === d.name)));

  updateArAvailability(d);
}

function fillChips(elId, items, extraClass) {
  const box = document.getElementById(elId);
  box.innerHTML = '';
  (items || []).forEach(t => {
    const s = document.createElement('span');
    s.className = 'chip' + extraClass;
    s.textContent = t;
    box.appendChild(s);
  });
}

/* ────────── AR availability ──────────
   canActivateAR is false when the phone or browser can't do AR at all,
   and on iPhone when no .usdz exists. Say what's missing, not "oops". */
function updateArAvailability(d) {
  const ready = viewer.canActivateAR;

  if (ready) {
    arBtn.disabled = false;
    arBtn.style.opacity = '1';
    arNote.className = 'ar-note';
    arNote.textContent = 'Point your camera at the table — the dish lands at its real size.';
    return;
  }

  arBtn.disabled = true;
  arBtn.style.opacity = '.45';
  arNote.className = 'ar-note warn';
  arNote.textContent = isIOS && !d.usdz
    ? 'Table view needs a .usdz file for this dish. Drag the model above to look around it.'
    : 'This device does not support AR. Drag the model above to look around it.';
}

arBtn.addEventListener('click', () => {
  if (viewer.canActivateAR) viewer.activateAR();
});

// canActivateAR is only reliable once the model has loaded.
viewer.addEventListener('load', () => updateArAvailability(DISHES[currentId()]));
function currentId() {
  const sel = [...tabsEl.children].find(t => t.getAttribute('aria-selected') === 'true');
  return Object.keys(DISHES).find(k => DISHES[k].name === sel?.textContent) || 'pizza';
}

/* ────────── go ────────── */
selectDish(Object.keys(DISHES)[0]);
</script>

</body>
</html>
