<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AR View</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { overflow:hidden; background:#000; font-family:-apple-system,sans-serif; }

        #viewer-ar { position:fixed; inset:0; z-index:1; display:block; }

        #viewer-ar video {
            position:fixed!important; top:0!important; left:0!important;
            width:100vw!important; height:100vh!important;
            object-fit:cover!important; z-index:1!important; display:block!important;
        }

        #viewer-ar canvas {
            position:fixed!important; top:0!important; left:0!important;
            width:100vw!important; height:100vh!important;
            z-index:2!important; background:transparent!important;
        }

        #top-bar {
            position:fixed; top:0; left:0; right:0; z-index:9999;
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 16px;
            background:linear-gradient(to bottom,rgba(0,0,0,0.7),transparent);
        }

        #back-btn {
            background:rgba(0,0,0,0.6); color:white; border:none;
            padding:8px 16px; border-radius:20px; font-size:14px; cursor:pointer;
        }

        #food-title {
            color:white; font-size:16px; font-weight:bold;
            text-shadow:0 1px 4px rgba(0,0,0,0.5);
        }

        /* Scan overlay */
        #scan-overlay {
            position:fixed; inset:0; z-index:9998;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:20px;
            pointer-events:none; transition:opacity 0.5s;
        }
        #scan-overlay.hidden { opacity:0; pointer-events:none; }

        /* Crosshair in centre of screen */
        #crosshair {
            width:60px; height:60px; position:relative;
        }
        #crosshair::before {
            content:'';
            position:absolute; top:50%; left:0; right:0; height:2px;
            background:#d4a574; transform:translateY(-50%);
            box-shadow:0 0 8px #d4a574;
        }
        #crosshair::after {
            content:'';
            position:absolute; left:50%; top:0; bottom:0; width:2px;
            background:#d4a574; transform:translateX(-50%);
            box-shadow:0 0 8px #d4a574;
        }

        #scan-text {
            color:white; font-size:15px; font-weight:bold;
            background:rgba(0,0,0,0.6); padding:10px 20px; border-radius:20px;
            text-align:center;
        }

        /* Reticle on table surface */
        #reticle {
            position:fixed; bottom:35%; left:50%;
            transform:translateX(-50%);
            z-index:9997; display:flex;
            flex-direction:column; align-items:center; gap:12px;
            pointer-events:none;
        }

        #reticle-ring {
            width:80px; height:80px;
            border:3px solid #d4a574; border-radius:50%;
            position:relative;
            animation:reticlePulse 1.5s ease-in-out infinite;
            box-shadow:0 0 20px rgba(212,165,116,0.5);
        }

        #reticle-ring::before {
            content:''; position:absolute; top:50%; left:50%;
            transform:translate(-50%,-50%);
            width:10px; height:10px;
            background:#d4a574; border-radius:50%;
        }

        #tap-label {
            color:white; font-size:14px; font-weight:bold;
            background:rgba(0,0,0,0.7);
            padding:8px 20px; border-radius:20px; letter-spacing:1px;
        }

        @keyframes reticlePulse {
            0%   { transform:scale(1);    opacity:1; }
            50%  { transform:scale(1.2);  opacity:0.7; }
            100% { transform:scale(1);    opacity:1; }
        }

        #place-confirm {
            position:fixed; top:80px; left:50%;
            transform:translateX(-50%);
            z-index:9999;
            background:rgba(44,24,16,0.9); color:#d4a574;
            padding:12px 24px; border-radius:20px;
            font-size:15px; font-weight:bold; display:none;
        }

        #free-controls {
            position:fixed; bottom:0; left:0; right:0; z-index:9999;
            background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);
            padding:16px; display:none;
            flex-direction:column; align-items:center; gap:10px;
        }

        #hint-text {
            color:rgba(255,255,255,0.85); font-size:12px; text-align:center;
            background:rgba(0,0,0,0.5); padding:6px 16px; border-radius:12px;
        }

        #reset-btn {
            background:rgba(212,165,116,0.9); color:white; border:none;
            padding:10px 24px; border-radius:20px;
            font-size:14px; font-weight:bold; cursor:pointer;
        }
    </style>
</head>
<body>

<div id="top-bar">
    <button id="back-btn" onclick="window.history.back()">← Back</button>
    <div id="food-title">Loading...</div>
    <div style="width:70px"></div>
</div>

<!-- MindAR Scene — still used for camera -->
<div id="viewer-ar">
    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.00001; filterBeta: 0.00001;"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.2"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false">

        <a-assets timeout="120000">
            <a-asset-item id="pizzaModel"  src="./pizza.glb"></a-asset-item>
            <a-asset-item id="burgerModel" src="./burger.glb"></a-asset-item>
            <a-asset-item id="drinkModel"  src="./drink.glb"></a-asset-item>
        </a-assets>

        <a-camera id="main-camera" position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Improved lighting -->
        <a-light type="ambient"     color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="2.0" position="1 3 2" cast-shadow="true"></a-light>
        <a-light type="directional" color="#ffe8d0" intensity="0.4" position="-2 1 -1"></a-light>

        <!-- MindAR target — still needed for camera init -->
        <a-entity mindar-image-target="targetIndex: 0">
        </a-entity>

        <!-- Food model placed in world space — fixed on table -->
        <a-entity id="food-container" position="0 0 -1" visible="false">

            <!-- Shadow under food -->
            <a-circle
                radius="0.4"
                rotation="-90 0 0"
                position="0 0.001 0"
                material="color:#000000; opacity:0.25; transparent:true; shader:flat">
            </a-circle>

            <!-- The food model -->
            <a-gltf-model
                id="placed-food"
                src=""
                position="0 0 0"
                scale="0 0 0"
                rotation="-90 0 0">
            </a-gltf-model>

        </a-entity>

    </a-scene>
</div>

<!-- Point at table overlay -->
<div id="scan-overlay">
    <div id="crosshair"></div>
    <div id="scan-text">Point camera at your table then tap to place food</div>
</div>

<!-- Reticle -->
<div id="reticle">
    <div id="reticle-ring"></div>
    <div id="tap-label">👆 TAP TO PLACE ON TABLE</div>
</div>

<!-- Place confirmation -->
<div id="place-confirm">🍽️ Food placed on table!</div>

<!-- Controls after placement -->
<div id="free-controls">
    <div id="hint-text">☝️ Drag to rotate &nbsp;·&nbsp; 🤏 Pinch to zoom</div>
    <button id="reset-btn" onclick="resetPlacement()">📷 Place Again</button>
</div>

<script>
    const params  = new URLSearchParams(window.location.search);
    const modelId = params.get('model') || 'pizza';

    const modelNames = {
        pizza:  'Margherita Pizza 🍕',
        burger: 'Classic Burger 🍔',
        drink:  'Fresh Lemonade 🥤'
    };

    // Original display sizes — appears at correct size immediately
    const modelScales = {
        pizza:  2.5,
        burger: 8.0,
        drink:  1.2
    };

    const modelSrc = {
        pizza:  '#pizzaModel',
        burger: '#burgerModel',
        drink:  '#drinkModel'
    };

    document.getElementById('food-title').innerText = modelNames[modelId];

    let arScale = modelScales[modelId];
    let rotY    = 0;
    let placed  = false;

    // Fix video white screen
    function fixVideo() {
        document.querySelectorAll('video').forEach(v => {
            v.style.cssText = 'position:fixed!important;top:0!important;left:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:1!important;display:block!important;';
        });
        document.querySelectorAll('#viewer-ar canvas').forEach(c => {
            c.style.cssText = 'position:fixed!important;top:0!important;left:0!important;width:100vw!important;height:100vh!important;z-index:2!important;background:transparent!important;';
        });
    }
    setInterval(fixVideo, 500);

    // Place model on tap
    function placeModel(e) {
        if (e.target.closest('#free-controls') || e.target.closest('#top-bar')) return;
        if (placed) return;
        placed = true;

        // Hide overlay
        document.getElementById('scan-overlay').classList.add('hidden');
        document.getElementById('reticle').style.display = 'none';

        // Get camera and place model 0.6m in front and 0.4m below camera
        const camera = document.getElementById('main-camera');
        const camPos = camera.getAttribute('position');
        const camRot = camera.getAttribute('rotation');

        // Place food container in front of camera on table level
        const container = document.getElementById('food-container');
        container.setAttribute('position', `0 -0.4 -0.6`);
        container.setAttribute('visible', 'true');

        // Set model source and show at correct size
        const foodModel = document.getElementById('placed-food');
        foodModel.setAttribute('src', modelSrc[modelId]);

        // Show at full size immediately — no growing animation
        foodModel.setAttribute('scale', `${arScale} ${arScale} ${arScale}`);
        foodModel.setAttribute('position', '0 0 0');
        foodModel.setAttribute('rotation', '-90 0 0');

        // Show controls
        document.getElementById('free-controls').style.display = 'flex';

        // Show confirmation
        const confirm = document.getElementById('place-confirm');
        confirm.style.display = 'block';
        setTimeout(() => { confirm.style.display = 'none'; }, 2000);
    }

    function resetPlacement() {
        placed = false;
        document.getElementById('scan-overlay').classList.remove('hidden');
        document.getElementById('reticle').style.display = 'flex';
        document.getElementById('free-controls').style.display = 'none';
        document.getElementById('food-container').setAttribute('visible', 'false');
        const foodModel = document.getElementById('placed-food');
        foodModel.setAttribute('scale', '0 0 0');
        rotY = 0;
    }

    // Tap to place
    document.addEventListener('click', placeModel);

    // Touch controls — rotate and zoom
    let lastX = null, lastY = null, lastPinch = null;

    document.addEventListener('touchstart', e => {
        if (e.target.closest('#free-controls') || e.target.closest('#top-bar')) return;
        if (!placed) { placeModel(e); return; }
        if (e.touches.length === 1) {
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            lastPinch = null;
        } else if (e.touches.length === 2) {
            lastPinch = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            lastX = null; lastY = null;
        }
    }, { passive: true });

    document.addEventListener('touchmove', e => {
        if (e.target.closest('#free-controls') || e.target.closest('#top-bar')) return;
        if (!placed) return;

        const el = document.getElementById('placed-food');
        if (!el) return;

        if (e.touches.length === 1 && lastX !== null) {
            const dx = e.touches[0].clientX - lastX;
            rotY += dx * 1.0;
            el.setAttribute('rotation', `-90 ${rotY} 0`);
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;

        } else if (e.touches.length === 2 && lastPinch !== null) {
            const nd = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            const delta = (nd - lastPinch) / lastPinch;
            arScale = Math.max(0.1, Math.min(25, arScale * (1 + delta * 0.8)));
            el.setAttribute('scale', `${arScale} ${arScale} ${arScale}`);
            lastPinch = nd;
        }
    }, { passive: true });

    document.addEventListener('touchend', () => {
        lastX = null; lastY = null; lastPinch = null;
    });
</script>
</body>
</html>
